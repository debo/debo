name: github-activity

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    name: Refresh README activity and stats
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/update-readme.mjs
        env:
          # PAT (authenticates as the user) surfaces private activity/stats.
          # Falls back to the Actions token, which sees public data only.
          GITHUB_TOKEN: ${{ secrets.PAT || github.token }}
          GH_USERNAME: debo
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: refresh readme activity and stats"
            git push
          fi
