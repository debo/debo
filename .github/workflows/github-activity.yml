name: github-activity

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    name: Refresh README activity and stats
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/update-readme.mjs
        env:
          # PAT (authenticates as the user) surfaces private activity/stats.
          # Falls back to the Actions token, which sees public data only.
          GITHUB_TOKEN: ${{ secrets.PAT || github.token }}
          GH_USERNAME: debo
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: refresh readme activity and stats"
            git push
          fi
